name: Package Easel-dsh · macOS (hosted)

# GitHub-hosted twin of easel-mac-package.yml: same steps, but on hosted
# macos runners (no self-hosted runner is registered on github.com).
# arm64 builds native, x64 cross-compiles with rustup target. Unsigned trial
# builds — do not publish to release channels.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '打包源码：分支名或 dsh-v* tag'
        type: string
        default: feat/easel-mac-package
        required: true

permissions:
  contents: read

concurrency:
  group: easel-mac-package-hosted
  cancel-in-progress: false

jobs:
  package-arm64:
    runs-on: macos-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
          ref: ${{ inputs.source_ref }}
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-arm64
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build repository artifacts (lib + web dist)
        run: pnpm run build
      - name: Stage the bundled runtime (arm64)
        working-directory: apps/desktop-tauri
        run: node scripts/bundle-runtime.mjs --platform mac --arch arm64
      - name: Verify closure architecture
        working-directory: apps/desktop-tauri
        shell: bash
        run: |
          EXPECTED="arm64"
          archs_of() {
            local raw
            if command -v lipo >/dev/null 2>&1; then
              raw=$(lipo -archs "$1" 2>/dev/null) || raw=$(file -b "$1")
            else
              raw=$(file -b "$1")
            fi
            echo "$raw" | grep -oE 'x86[_-]64|arm64' | head -1 | sed 's/x86[_-]64/x64/'
          }
          node_arch=$(archs_of runtime/node/node || true)
          echo "runtime node arch: $node_arch (expected $EXPECTED)"
          echo "$node_arch" | grep -qw "$EXPECTED" || { echo "ERROR: node arch mismatch"; exit 1; }
          bad=0
          for f in $(find runtime/dsh/node_modules -name '*.node'); do
            a=$(archs_of "$f" || true)
            echo "  $(basename "$f") -> $a"
            if [ -n "$a" ]; then
              echo "$a" | grep -qw "$EXPECTED" || { echo "  FOREIGN: $f"; bad=1; }
            fi
          done
          test "$bad" -eq 0
      # The tauri CLI runs a workspace-level `pnpm install --production` deps
      # check that executes the repo root postinstall (lefthook) and fails
      # without devDependencies. Hide the workspace declarations around the
      # tauri build; the shell has no workspace memberships of its own.
      - name: Hide workspace root from tauri deps check
        shell: bash
        run: |
          mv pnpm-workspace.yaml pnpm-workspace.yaml.bak
          node -e 'const fs=require("fs");const p="package.json";const j=JSON.parse(fs.readFileSync(p,"utf8"));delete j.workspaces;fs.writeFileSync(p,JSON.stringify(j,null,2)+"\n")'
      - name: Build Tauri app (arm64 dmg)
        working-directory: apps/desktop-tauri
        run: pnpm tauri build --verbose --bundles dmg
      - name: Restore workspace declarations
        if: always()
        shell: bash
        run: |
          [ -f pnpm-workspace.yaml.bak ] && mv -f pnpm-workspace.yaml.bak pnpm-workspace.yaml || true
          git checkout -- package.json
      - name: Resolve the artifact version
        if: success()
        run: echo "VERSION=$(node -p "require('./apps/desktop-tauri/src-tauri/tauri.conf.json').version")" >> "$GITHUB_ENV"
      - name: Retain the installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: easel-dsh-mac-arm64-${{ env.VERSION }}-${{ github.run_id }}
          include-hidden-files: true
          path: apps/desktop-tauri/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Retain build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easel-dsh-mac-arm64-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/desktop-tauri/runtime/manifest.json
            apps/desktop-tauri/src-tauri/target/release/bundle/dmg/
          if-no-files-found: warn
          retention-days: 7

  package-x64:
    runs-on: macos-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
          ref: ${{ inputs.source_ref }}
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-x64
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build repository artifacts (lib + web dist)
        run: pnpm run build
      - name: Add cross-arch Rust target
        run: rustup target add x86_64-apple-darwin
      - name: Stage the bundled runtime (x64)
        working-directory: apps/desktop-tauri
        run: node scripts/bundle-runtime.mjs --platform mac --arch x64
      - name: Verify closure architecture
        working-directory: apps/desktop-tauri
        shell: bash
        run: |
          EXPECTED="x64"
          archs_of() {
            local raw
            if command -v lipo >/dev/null 2>&1; then
              raw=$(lipo -archs "$1" 2>/dev/null) || raw=$(file -b "$1")
            else
              raw=$(file -b "$1")
            fi
            echo "$raw" | grep -oE 'x86[_-]64|arm64' | head -1 | sed 's/x86[_-]64/x64/'
          }
          node_arch=$(archs_of runtime/node/node || true)
          echo "runtime node arch: $node_arch (expected $EXPECTED)"
          echo "$node_arch" | grep -qw "$EXPECTED" || { echo "ERROR: node arch mismatch"; exit 1; }
          bad=0
          for f in $(find runtime/dsh/node_modules -name '*.node'); do
            a=$(archs_of "$f" || true)
            echo "  $(basename "$f") -> $a"
            if [ -n "$a" ]; then
              echo "$a" | grep -qw "$EXPECTED" || { echo "  FOREIGN: $f"; bad=1; }
            fi
          done
          test "$bad" -eq 0
      - name: Hide workspace root from tauri deps check
        shell: bash
        run: |
          mv pnpm-workspace.yaml pnpm-workspace.yaml.bak
          node -e 'const fs=require("fs");const p="package.json";const j=JSON.parse(fs.readFileSync(p,"utf8"));delete j.workspaces;fs.writeFileSync(p,JSON.stringify(j,null,2)+"\n")'
      - name: Build Tauri app (x64 dmg)
        working-directory: apps/desktop-tauri
        run: pnpm tauri build --verbose --bundles dmg --target x86_64-apple-darwin
      - name: Restore workspace declarations
        if: always()
        shell: bash
        run: |
          [ -f pnpm-workspace.yaml.bak ] && mv -f pnpm-workspace.yaml.bak pnpm-workspace.yaml || true
          git checkout -- package.json
      - name: Resolve the artifact version
        if: success()
        run: echo "VERSION=$(node -p "require('./apps/desktop-tauri/src-tauri/tauri.conf.json').version")" >> "$GITHUB_ENV"
      - name: Retain the installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: easel-dsh-mac-x64-${{ env.VERSION }}-${{ github.run_id }}
          include-hidden-files: true
          path: apps/desktop-tauri/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Retain build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easel-dsh-mac-x64-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/desktop-tauri/runtime/manifest.json
            apps/desktop-tauri/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/
          if-no-files-found: warn
          retention-days: 7
