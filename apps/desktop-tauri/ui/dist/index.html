<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Easel-dsh</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="shell">
  <div id="splash" class="splash">
    <img class="splash-badge" src="easel-badge.png" alt="Easel-dsh" />
    <div class="splash-title">Easel-dsh</div>
    <div class="splash-status"><span class="spinner"></span><span id="splash-status">正在启动本地服务…</span></div>
  </div>
  <div id="error-banner" class="error-banner hidden">
    <span id="error-text"></span>
    <button id="btn-retry" class="btn">重启服务</button>
  </div>
  <main class="frame-host">
    <iframe id="dsh-frame" title="Easel-dsh" src="about:blank"></iframe>
  </main>
  <script src="app.js"></script>
</body>
</html>
