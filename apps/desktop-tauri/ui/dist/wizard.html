<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>欢迎使用 Easel-dsh</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="wizard">
  <main class="wizard-card">
    <h1>欢迎使用 Easel-dsh</h1>
    <p class="wizard-sub">选择默认智能体预设。预设决定每个新会话的工具组合，之后可随时在「设置 → Agent 预设」中调整。</p>

    <section>
      <h2>1. 默认预设</h2>
      <div id="preset-list" class="preset-list"></div>
    </section>

    <div id="progress" class="progress hidden">
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <p id="progress-text" class="hint"></p>
    </div>

    <div class="wizard-actions">
      <button id="btn-finish" class="btn primary">开始使用</button>
    </div>
  </main>
  <script src="wizard.js"></script>
</body>
</html>
