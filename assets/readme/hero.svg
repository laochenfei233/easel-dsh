<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Easel-dsh — 基于 DeepSeek Harness 的桌面版社媒运营工作台</title>
  <desc id="hero-desc">项目名 Easel-dsh，一句话定位，以及本地数据、多模型、跨平台三个标签；右侧是一副画架托起画布的线稿。</desc>
  <rect x="0" y="0" width="1200" height="360" rx="24" fill="#f7f4ee" stroke="#e7e2d8" stroke-width="1"/>

  <!-- 左侧文字区 -->
  <text x="76" y="100" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="21" letter-spacing="6" fill="#b45309">桌面版社媒运营工作台</text>
  <text x="74" y="182" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="78" font-weight="700" fill="#1c1917">Easel-dsh</text>
  <text x="76" y="228" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="26" fill="#57534e">基于 DeepSeek Harness 构建</text>
  <text x="76" y="262" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="26" fill="#57534e">让 AI 技能把选题变成可发布的内容</text>

  <!-- 标签胶囊 -->
  <g font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="18" fill="#78716c">
    <rect x="76" y="288" width="104" height="34" rx="17" fill="none" stroke="#d6d0c4"/>
    <text x="128" y="311" text-anchor="middle">本地数据</text>
    <rect x="196" y="288" width="86" height="34" rx="17" fill="none" stroke="#d6d0c4"/>
    <text x="239" y="311" text-anchor="middle">多模型</text>
    <rect x="298" y="288" width="188" height="34" rx="17" fill="none" stroke="#d6d0c4"/>
    <text x="392" y="311" text-anchor="middle">Windows · macOS · Linux</text>
  </g>

  <!-- 右侧画架线稿 -->
  <ellipse cx="960" cy="310" rx="86" ry="9" fill="#e9e4da"/>
  <g stroke="#1c1917" stroke-width="6" stroke-linecap="round">
    <line x1="872" y1="300" x2="960" y2="88"/>
    <line x1="1048" y1="300" x2="960" y2="88"/>
    <line x1="896" y1="232" x2="1024" y2="232"/>
  </g>
  <rect x="912" y="118" width="96" height="104" rx="4" fill="#ffffff" stroke="#d6d0c4" stroke-width="2"/>
  <g stroke="#c9c2b4" stroke-width="5" stroke-linecap="round">
    <line x1="926" y1="140" x2="994" y2="140"/>
    <line x1="926" y1="158" x2="978" y2="158"/>
    <line x1="926" y1="176" x2="988" y2="176"/>
  </g>
  <path d="M926 200 Q952 186 994 198" fill="none" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>
</svg>
